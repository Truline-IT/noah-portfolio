<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turtle Obby: Ocean Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#123a5a;--gold:#ffc61a;--green:#2ecc71;--pink:#ff5d8f;--purple:#8e5cff;--panel:rgba(255,255,255,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka','Baloo 2',system-ui,sans-serif;color:#fff;background:#0077d9;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;user-select:none;-webkit-user-select:none}
/* ---------- OCEAN BACKGROUND ---------- */
#ocean{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#6ff0ff 0%,#14c3f5 28%,#0a86e0 62%,#0a3f96 100%)}
.ray{position:absolute;top:-10%;width:120px;height:130%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));transform-origin:top;filter:blur(6px);animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(18deg);opacity:.5}to{transform:rotate(8deg);opacity:.9}}
.wave{position:absolute;left:0;width:200%;height:130px;background-repeat:repeat-x;background-size:800px 130px;animation:wave 9s linear infinite}
.wave.w1{bottom:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 130'><path d='M0 60 Q100 15 200 60 T400 60 T600 60 T800 60 V130 H0Z' fill='%23ffffff' fill-opacity='.16'/></svg>")}
.wave.w2{bottom:-20px;animation-duration:13s;animation-direction:reverse;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 130'><path d='M0 70 Q100 30 200 70 T400 70 T600 70 T800 70 V130 H0Z' fill='%23003a8c' fill-opacity='.35'/></svg>")}
.wave.top{top:0;bottom:auto;transform:scaleY(-1);opacity:.6}
@keyframes wave{to{transform:translateX(-800px)}}
.bgBubble{position:absolute;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.1) 40%,rgba(255,255,255,.05));animation:bgRise linear forwards}
@keyframes bgRise{to{transform:translate(30px,-115vh)}}
.fish{position:absolute;font-size:44px;animation:swim linear forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
@keyframes swim{from{left:-80px}to{left:calc(100% + 80px)}}
.fish.left{animation-name:swimL}
@keyframes swimL{from{left:calc(100% + 80px)}to{left:-80px}}
.spark{position:absolute;font-size:22px;animation:twinkle 1.6s ease-in-out forwards;pointer-events:none}
@keyframes twinkle{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.3) rotate(90deg);opacity:1}100%{transform:scale(0) rotate(180deg);opacity:0}}
/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;height:84px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;pointer-events:none}
#hud>*{pointer-events:auto}
.coins{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff6c9,#ffd84a);color:#6b4200;font-weight:700;font-size:30px;padding:6px 20px 6px 10px;border-radius:40px;box-shadow:0 6px 0 #c98a00,0 10px 18px rgba(0,0,0,.25);border:4px solid #fff}
.coins .shell{font-size:36px;animation:bob 2s ease-in-out infinite}
.coins.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.hudBtn{width:72px;height:72px;border-radius:22px;border:4px solid #fff;font-size:34px;background:linear-gradient(#7ee0ff,#2a9df4);box-shadow:0 6px 0 #1769b8,0 10px 16px rgba(0,0,0,.25);color:#fff}
.hudBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #1769b8}
.hudL,.hudR{display:flex;gap:10px}
#lockBtn{position:fixed;left:12px;bottom:12px;z-index:60;width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(0,40,90,.45);font-size:24px;color:#fff;touch-action:none}
#lockBtn svg{position:absolute;inset:-6px;width:68px;height:68px;transform:rotate(-90deg);pointer-events:none}
#lockBtn circle{fill:none;stroke:#ffd84a;stroke-width:6;stroke-dasharray:190;stroke-dashoffset:190}
#lockBtn.holding circle{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}
/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:76px;min-width:76px;padding:12px 30px;border:4px solid #fff;border-radius:26px;font-size:30px;font-weight:700;color:#5a3500;background:linear-gradient(#ffe46b,#ffb300);box-shadow:0 8px 0 #c77c00,0 14px 22px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn:hover{animation:wiggle .5s}
.btn:active{transform:translateY(7px);box-shadow:0 1px 0 #c77c00,0 4px 8px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(#7dffa8,#1fc764);color:#064d22;box-shadow:0 8px 0 #12863f,0 14px 22px rgba(0,0,0,.25)}
.btn.green:active{box-shadow:0 1px 0 #12863f}
.btn.blue{background:linear-gradient(#8ee8ff,#2a9df4);color:#06345e;box-shadow:0 8px 0 #1769b8,0 14px 22px rgba(0,0,0,.25)}
.btn.blue:active{box-shadow:0 1px 0 #1769b8}
.btn.pink{background:linear-gradient(#ffb0cb,#ff4f8b);color:#5c0022;box-shadow:0 8px 0 #c2185b,0 14px 22px rgba(0,0,0,.25)}
.btn.pink:active{box-shadow:0 1px 0 #c2185b}
.btn.purple{background:linear-gradient(#c6a8ff,#8e5cff);color:#fff;text-shadow:none;box-shadow:0 8px 0 #5b2fc9,0 14px 22px rgba(0,0,0,.25)}
.btn.purple:active{box-shadow:0 1px 0 #5b2fc9}
.btn.huge{font-size:44px;min-height:100px;padding:16px 48px;border-radius:34px}
.btn.small{min-height:70px;font-size:24px;padding:8px 18px}
@keyframes wiggle{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.spk{width:72px;height:72px;min-width:72px;border-radius:50%;border:4px solid #fff;font-size:32px;background:linear-gradient(#b8f1ff,#38b6ff);box-shadow:0 6px 0 #1769b8;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;padding:0}
.spk:active{transform:translateY(5px);box-shadow:0 1px 0 #1769b8}
.spk.talking{animation:pulse .6s infinite}
/* ---------- SCREENS ---------- */
.screen{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;overflow-x:hidden;padding:92px 16px 110px}
.screen.on{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}}
.wrap{max-width:980px;margin:0 auto}
.panel{background:var(--panel);color:var(--ink);border-radius:30px;padding:20px;box-shadow:0 10px 0 rgba(0,40,90,.25),0 18px 30px rgba(0,0,0,.2);border:5px solid #fff}
.lvlHead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.lvlBadge{font-size:52px;width:90px;height:90px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#d5f3ff);box-shadow:0 6px 0 #1769b8;border:4px solid #fff;animation:bob 2.4s ease-in-out infinite}
.lvlNum{font-size:20px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:2px}
.lvlTitle{font-size:40px;font-weight:700;line-height:1;text-shadow:0 4px 0 rgba(0,40,100,.35)}
.lvlHead .grow{flex:1}
.say{font-size:26px;font-weight:600;background:rgba(0,40,100,.35);padding:12px 18px;border-radius:20px;margin-bottom:16px;line-height:1.25}
.center{text-align:center}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wobble{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-14px) rotate(-6deg)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px) rotate(-3deg)}80%{transform:translateX(5px) rotate(2deg)}}
.wobble{animation:wobble .6s}
/* ---------- RIDER ---------- */
.rider{display:block;overflow:visible}
.bobbing{animation:bob 2.2s ease-in-out infinite}
.rider .flipF{transform-box:fill-box;transform-origin:left center;animation:flap 1s ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(-28deg)}}
/* ---------- TITLE ---------- */
#title{text-align:center;padding-top:40px}
.bigTitle{font-size:clamp(54px,11vw,120px);font-weight:700;line-height:.9;letter-spacing:2px;color:#fff;text-shadow:0 6px 0 #ff8a00,0 12px 0 #c2410c,0 20px 30px rgba(0,0,0,.35);transform:rotate(-3deg);animation:titleBob 3s ease-in-out infinite}
.subTitle{display:inline-block;margin-top:24px;font-size:clamp(30px,6vw,54px);font-weight:700;background:linear-gradient(#7dffa8,#1fc764);color:#064d22;padding:6px 30px;border-radius:40px;border:5px solid #fff;box-shadow:0 8px 0 #12863f;transform:rotate(2deg)}
@keyframes titleBob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-12px)}}
#titleRider{width:min(380px,80vw);margin:10px auto 0}
#playBtn{animation:pulse 1.2s ease-in-out infinite;font-size:64px;padding:18px 80px;min-height:120px;border-radius:44px}
/* ---------- MAP ---------- */
#mapInner{position:relative;height:calc(100vh - 200px);min-height:600px;max-width:1000px;margin:0 auto}
#mapPath{position:absolute;inset:0;width:100%;height:100%}
.island{position:absolute;transform:translate(-50%,-50%);width:clamp(96px,15vw,150px);height:clamp(96px,15vw,150px);border:none;background:none;padding:0;color:var(--ink)}
.island .rock{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 50% 30%,#fff4c2 0 34%,#ffd56b 35% 52%,#33c46b 53% 70%,#1f8f4e 71%);box-shadow:0 14px 0 #146b39,0 22px 26px rgba(0,0,0,.3);border:5px solid #fff;animation:bob 3s ease-in-out infinite}
.island .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,6vw,56px);animation:bob 3s ease-in-out infinite}
.island .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:18px;white-space:nowrap;font-weight:700;font-size:clamp(16px,2.6vw,22px);background:#fff;color:var(--ink);padding:4px 14px;border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.island .num{position:absolute;top:-10px;left:-6px;width:44px;height:44px;border-radius:50%;background:var(--purple);color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;border:4px solid #fff;z-index:2}
.island.locked .rock{filter:grayscale(1) brightness(.85)}
.island.locked .ico{filter:grayscale(1);opacity:.6}
.island .lock{position:absolute;right:-8px;bottom:6px;font-size:40px;z-index:3}
.island .flag{position:absolute;right:-6px;top:-34px;font-size:52px;z-index:3;filter:drop-shadow(0 0 12px #ffe600) drop-shadow(0 0 22px #fff59d);animation:flagWave 1s ease-in-out infinite alternate;transform-origin:bottom left}
@keyframes flagWave{to{transform:rotate(-10deg) scale(1.08)}}
.island.current .rock{box-shadow:0 14px 0 #146b39,0 0 0 8px rgba(255,255,255,.7),0 0 40px 18px #fff59d}
.island.victory .rock{background:radial-gradient(circle at 50% 30%,#fff 0 30%,#ffe36b 31% 55%,#ffb300 56% 72%,#c77c00 73%)}
#mapRider{position:absolute;width:clamp(110px,16vw,160px);transform:translate(-50%,-112%);transition:left 1.2s cubic-bezier(.5,-0.3,.5,1.3),top 1.2s cubic-bezier(.5,-0.3,.5,1.3);pointer-events:none;z-index:4}
.mapTip{display:flex;align-items:center;gap:12px;justify-content:center;font-size:26px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.25)}
/* ---------- LEVEL 1 ---------- */
#bz{position:relative;height:max(52vh,330px);border-radius:30px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,30,90,.3));border:5px solid rgba(255,255,255,.6)}
.fb{position:absolute;bottom:-170px;width:150px;height:150px;border-radius:50%;border:none;padding:10px;color:var(--ink);background:radial-gradient(circle at 30% 25%,#fff 0 12%,rgba(255,255,255,.75) 13%,rgba(190,240,255,.75) 60%,rgba(120,210,255,.85));box-shadow:inset -8px -10px 20px rgba(0,90,180,.35),0 0 0 4px rgba(255,255,255,.85),0 10px 20px rgba(0,0,0,.2);animation:fbRise linear forwards;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fb .em{font-size:52px;line-height:1}
.fb .tx{font-size:17px;font-weight:700;line-height:1.05;margin-top:4px}
.fb.trick{background:radial-gradient(circle at 30% 25%,#fff 0 12%,rgba(255,240,255,.8) 13%,rgba(255,200,240,.8) 60%,rgba(230,150,255,.9))}
@keyframes fbRise{to{transform:translateY(var(--rise))}}
.fb.popped{animation:popIt .35s forwards!important}
@keyframes popIt{to{transform:translateY(var(--y)) scale(1.6);opacity:0}}
.fb.bonked{animation:bonkIt .7s forwards!important}
@keyframes bonkIt{30%{transform:translateY(var(--y)) scale(1.2) rotate(-15deg)}60%{transform:translateY(var(--y)) scale(.9) rotate(15deg)}100%{transform:translateY(calc(var(--y) + 300px)) rotate(180deg);opacity:0}}
.pop{position:fixed;pointer-events:none;z-index:90;font-size:30px;animation:popFly .8s ease-out forwards}
@keyframes popFly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#bonk{position:fixed;left:50%;top:40%;z-index:95;transform:translate(-50%,-50%);pointer-events:none;text-align:center;display:none}
#bonk.on{display:block;animation:bonkIn 1.8s forwards}
#bonk .b1{font-size:clamp(70px,16vw,150px);font-weight:700;color:#fff;text-shadow:0 8px 0 #ff2fa0,0 14px 0 #8e1060,0 20px 30px rgba(0,0,0,.4)}
#bonk .b2{font-size:34px;font-weight:700;background:#fff;color:#8e1060;padding:8px 22px;border-radius:30px;display:inline-block;border:4px solid #ff8ccf}
@keyframes bonkIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}15%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.pack{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;background:rgba(80,40,10,.35);padding:12px;border-radius:26px;border:4px dashed rgba(255,255,255,.6)}
.pack .bag{font-size:52px}
.slot{width:76px;height:76px;border-radius:20px;border:4px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);font-size:40px;display:flex;align-items:center;justify-content:center;color:#fff}
.slot.full{background:linear-gradient(#fff,#d6f6ff);animation:pulse .5s}
.packCount{font-size:30px;font-weight:700;margin-left:auto;padding-right:8px}
/* ---------- LEVEL 2 ---------- */
.web{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:". where ." "how mid kind" ". when .";gap:12px;align-items:stretch;position:relative}
.webLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wmid{grid-area:mid;align-self:center;justify-self:center;width:min(190px,28vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a0ffbf,#1fc764);border:6px solid #fff;box-shadow:0 8px 0 #12863f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#064d22;font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;z-index:1;animation:pulse 2.4s infinite}
.wmid .tt{font-size:clamp(40px,7vw,64px)}
.wbox{min-height:150px;border-radius:26px;background:rgba(255,255,255,.92);color:var(--ink);border:5px dashed #8ad7ff;padding:10px;z-index:1;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.wbox.hot{transform:scale(1.05);border-color:#ffc61a;border-style:solid;box-shadow:0 0 30px #fff59d}
.wbox.filled{border-style:solid;border-color:#2ecc71;background:linear-gradient(#f0fff5,#d4ffe2)}
.wbox .wh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:clamp(18px,3vw,26px)}
.wbox .wh .spk{width:56px;height:56px;min-width:56px;font-size:24px}
.wbox[data-box=where]{grid-area:where}.wbox[data-box=how]{grid-area:how}.wbox[data-box=kind]{grid-area:kind}.wbox[data-box=when]{grid-area:when}
.placed{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 8px;font-size:16px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:pulse .4s}
.placed .e{font-size:28px}
.l2grid{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.chips{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:10px;align-items:stretch;min-height:90px;padding:12px;border-radius:26px;background:rgba(60,30,8,.45);border:4px dashed rgba(255,255,255,.7)}
.chips .chip{font-size:18px}
@media (max-width:760px){.l2grid{grid-template-columns:1fr}.chips{order:-1;position:static;flex-direction:row;flex-wrap:wrap;justify-content:center}}
.wbox{min-height:120px!important}
.chip{touch-action:none;min-height:80px;min-width:80px;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:24px;border:4px solid #fff;background:linear-gradient(#fff,#d6f6ff);color:var(--ink);font-size:20px;font-weight:700;box-shadow:0 6px 0 #1769b8;cursor:grab}
.chip .e{font-size:40px}
.chip.sel{background:linear-gradient(#fff6c9,#ffd84a);box-shadow:0 6px 0 #c98a00,0 0 0 6px rgba(255,230,0,.6)}
.chip.dragging{opacity:.3}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg) scale(1.1);opacity:.95}
/* ---------- WRITING ---------- */
.bigText{width:100%;min-height:150px;font-family:inherit;font-size:30px;font-weight:500;line-height:1.35;padding:16px 20px;border-radius:24px;border:5px solid #8ad7ff;background:#fff;color:#0d2b45;resize:vertical;outline:none;box-shadow:inset 0 4px 0 rgba(0,0,0,.06)}
.bigText:focus{border-color:#ffc61a;box-shadow:0 0 0 6px rgba(255,198,26,.35)}
input.bigText{min-height:80px}
.pad{position:relative;background:linear-gradient(160deg,#8e5cff,#5b2fc9);border-radius:32px;padding:18px;border:6px solid #fff;box-shadow:0 10px 0 #3c1a8f,0 18px 30px rgba(0,0,0,.3)}
.padTitle{font-size:32px;font-weight:700;display:flex;align-items:center;gap:12px;margin-bottom:12px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.checks{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.chk{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;background:rgba(255,255,255,.2);padding:10px 16px;border-radius:20px;border:3px solid rgba(255,255,255,.5);transition:.2s}
.chk .bx{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px}
.chk.ok{background:#2ecc71;border-color:#fff;animation:pulse .4s}
.chk.ok .bx{background:#fff}
.hints{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.hint{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:20px;padding:6px 6px 6px 16px;font-size:22px;font-weight:600}
.hint .spk{width:60px;height:60px;min-width:60px;font-size:26px}
.hintLbl{font-size:20px;font-weight:700;opacity:.9;margin-top:8px}
.frameBtn{display:block;width:100%;text-align:left;margin:10px 0;font-size:26px}
.sentenceBuild{font-size:34px;font-weight:700;background:#fff;color:var(--ink);border-radius:24px;padding:20px;margin:14px 0;min-height:90px;line-height:1.5}
.blank{display:inline-block;min-width:150px;border-bottom:6px dashed #8e5cff;color:#8e5cff;text-align:center}
.blank.fill{border-bottom:6px solid #2ecc71;color:#12863f;animation:pulse .5s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.coachNote{font-size:18px;opacity:.85;margin-top:8px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{flex:1;min-width:150px;font-size:22px;font-weight:700;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.18);opacity:.55;text-align:center}
.step.on{background:#ffd84a;color:#5a3500;opacity:1;animation:pulse 1.2s infinite}
.starters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.starter{font-size:22px;min-height:72px;padding:8px 18px}
.scard.hasSpot{border-color:#ffd84a;box-shadow:0 0 0 5px rgba(255,216,74,.5)}
/* ---------- LEVEL 4 ---------- */
.towerWrap{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:18px;align-items:start}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],confUntil=0,confRAF=null;
function confettiBurst(ms){cv.width=innerWidth;cv.height=innerHeight;confUntil=Math.max(confUntil,performance.now()+ms);
 for(let i=0;i<140;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:['#ffd84a','#ff4f8b','#2ecc71','#2a9df4','#8e5cff','#ff7a59'][i%6]});
 if(!confRAF)confRAF=requestAnimationFrame(confLoop)}
function confLoop(t){cx.clearRect(0,0,cv.width,cv.height);if(t<confUntil&&parts.length<400&&Math.random()<.3)parts.push({x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:0,vr:.2,s:8,c:['#ffd84a','#ff4f8b','#2ecc71','#2a9df4'][Math.floor(Math.random()*4)]});
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 parts=parts.filter(p=>p.y<cv.height+30);if(parts.length){confRAF=requestAnimationFrame(confLoop)}else{confRAF=null;cx.clearRect(0,0,cv.width,cv.height)}}
